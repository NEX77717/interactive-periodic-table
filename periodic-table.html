<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Periodic Table of Elements</title>
<link href="https://fonts.googleapis.com/css2?family=DM+Mono:wght@300;400;500&family=Syne:wght@300;400;500;600&display=swap" rel="stylesheet">
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  :root {
    --bg: #060810;
    --glass: rgba(255,255,255,0.04);
    --glass-border: rgba(255,255,255,0.09);
    --glass-hover: rgba(255,255,255,0.09);
    --text-primary: rgba(255,255,255,0.92);
    --text-muted: rgba(255,255,255,0.38);
    --text-dim: rgba(255,255,255,0.18);

    --alkali:       #e05f3e;
    --alkaline:     #e08b3e;
    --transition:   #4a9eff;
    --posttrans:    #6ecf8c;
    --metalloid:    #b08aff;
    --nonmetal:     #ff7eb3;
    --halogen:      #ff5b7a;
    --noble:        #50d9e0;
    --lanthanide:   #f0c060;
    --actinide:     #e07898;
  }

  html, body {
    min-height: 100vh;
    background: radial-gradient(ellipse at 20% 10%, #1a0040 0%, #0d001a 40%, #000d1a 70%, #001a0d 100%);
    font-family: 'Syne', sans-serif;
    color: var(--text-primary);
    overflow-x: hidden;
  }

  /* ── Background: floating chemistry symbols ── */
  .bg-canvas {
    position: fixed; inset: 0; pointer-events: none; z-index: 0;
    overflow: hidden;
  }
  .bg-symbol {
    position: absolute;
    font-family: 'DM Mono', monospace;
    user-select: none;
    animation: floatSym linear infinite;
  }

  @keyframes floatSym {
    0%   { transform: translateY(0) rotate(0deg); opacity: 0; }
    10%  { opacity: 1; }
    90%  { opacity: 1; }
    100% { transform: translateY(-110vh) rotate(20deg); opacity: 0; }
  }

  /* ── Noise grain overlay ── */
  body::after {
    content: '';
    position: fixed; inset: 0;
    background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 200 200' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.85' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)' opacity='0.04'/%3E%3C/svg%3E");
    pointer-events: none; z-index: 0; opacity: 0.6;
  }

  /* ── Ambient blobs ── */
  .blob {
    position: fixed; border-radius: 50%; filter: blur(120px);
    pointer-events: none; z-index: 0; animation: drift 20s ease-in-out infinite;
  }
  .blob1 { width: 700px; height: 700px; top: -250px; left: -150px; background: rgba(180,0,255,0.22); animation-delay: 0s; }
  .blob2 { width: 600px; height: 600px; bottom: -200px; right: -150px; background: rgba(0,220,255,0.18); animation-delay: -7s; }
  .blob3 { width: 500px; height: 500px; top: 35%; left: 35%; background: rgba(255,0,150,0.14); animation-delay: -13s; }
  .blob4 { width: 400px; height: 400px; top: 60%; left: 5%; background: rgba(0,255,140,0.10); animation-delay: -4s; }
  .blob5 { width: 350px; height: 350px; top: 10%; right: 10%; background: rgba(255,200,0,0.10); animation-delay: -10s; }

  @keyframes drift {
    0%, 100% { transform: translate(0,0) scale(1); }
    33%  { transform: translate(40px,-30px) scale(1.05); }
    66%  { transform: translate(-30px,40px) scale(0.95); }
  }

  /* ── Layout ── */
  .page { position: relative; z-index: 1; padding: 2rem 1.5rem 4rem; }

  header {
    text-align: center;
    margin-bottom: 2.5rem;
  }
  header h1 {
    font-size: clamp(1.6rem, 4vw, 2.6rem);
    font-weight: 300;
    letter-spacing: 0.35em;
    text-transform: uppercase;
    color: var(--text-primary);
  }
  header p {
    font-family: 'DM Mono', monospace;
    font-size: 0.72rem;
    color: var(--text-muted);
    letter-spacing: 0.15em;
    margin-top: 0.4rem;
  }

  /* ── Legend ── */
  .legend {
    display: flex; flex-wrap: wrap; gap: 8px;
    justify-content: center;
    margin-bottom: 2rem;
  }
  .legend-item {
    display: flex; align-items: center; gap: 6px;
    font-family: 'DM Mono', monospace;
    font-size: 0.62rem;
    color: var(--text-muted);
    letter-spacing: 0.06em;
    cursor: pointer;
    padding: 4px 10px;
    border-radius: 20px;
    border: 0.5px solid transparent;
    transition: all 0.2s;
  }
  .legend-item:hover { border-color: var(--glass-border); background: var(--glass); }
  .legend-dot { width: 8px; height: 8px; border-radius: 2px; flex-shrink: 0; }

  /* ── Periodic Table Grid ── */
  .table-wrapper {
    overflow-x: auto;
    padding-bottom: 1rem;
  }
  .pt-grid {
    display: grid;
    grid-template-columns: repeat(18, minmax(44px, 52px));
    grid-template-rows: repeat(10, minmax(44px, 52px));
    gap: 3px;
    width: max-content;
    margin: 0 auto;
  }

  /* ── Element cell ── */
  .el {
    position: relative;
    border-radius: 6px;
    border: 0.5px solid var(--glass-border);
    background: var(--glass);
    cursor: pointer;
    display: flex; flex-direction: column;
    align-items: center; justify-content: center;
    padding: 2px;
    transition: transform 0.15s ease, background 0.15s ease, box-shadow 0.15s ease, border-color 0.15s ease;
    backdrop-filter: blur(6px);
    -webkit-backdrop-filter: blur(6px);
    overflow: hidden;
  }
  .el::before {
    content: '';
    position: absolute; inset: 0;
    border-radius: 6px;
    background: linear-gradient(135deg, rgba(255,255,255,0.06) 0%, transparent 60%);
    pointer-events: none;
  }
  .el:hover {
    transform: scale(1.18) translateZ(0);
    z-index: 10;
    border-color: var(--el-color, rgba(255,255,255,0.25));
    box-shadow: 0 0 20px -4px var(--el-color, rgba(255,255,255,0.2)),
                0 8px 32px rgba(0,0,0,0.5),
                inset 0 1px 0 rgba(255,255,255,0.12);
    background: var(--glass-hover);
  }
  .el.active {
    border-color: var(--el-color, rgba(255,255,255,0.4));
    box-shadow: 0 0 28px -4px var(--el-color, rgba(255,255,255,0.3)),
                0 8px 40px rgba(0,0,0,0.6),
                inset 0 1px 0 rgba(255,255,255,0.14);
    background: rgba(255,255,255,0.07);
    transform: scale(1.18) translateZ(0);
    z-index: 10;
  }

  .el-num {
    font-family: 'DM Mono', monospace;
    font-size: 0.52rem;
    color: var(--text-muted);
    line-height: 1;
    align-self: flex-start;
    padding-left: 3px;
    padding-top: 2px;
  }
  .el-sym {
    font-size: 1.05rem;
    font-weight: 600;
    line-height: 1;
    color: var(--el-color, var(--text-primary));
    letter-spacing: -0.01em;
  }
  .el-name {
    font-family: 'DM Mono', monospace;
    font-size: 0.38rem;
    color: var(--text-muted);
    letter-spacing: 0.03em;
    line-height: 1.2;
    text-align: center;
  }

  /* Gap cells */
  .gap { background: none; border: none; cursor: default; pointer-events: none; }
  .gap:hover { transform: none; box-shadow: none; }

  /* Lanthanide/actinide separator label */
  .series-label {
    grid-column: 1 / 4;
    display: flex; align-items: center; justify-content: flex-end;
    padding-right: 6px;
    font-family: 'DM Mono', monospace;
    font-size: 0.5rem;
    color: var(--text-dim);
    letter-spacing: 0.1em;
    pointer-events: none;
  }

  /* ── Detail Panel — Liquid Glass ── */
  .panel-overlay {
    position: fixed; inset: 0; z-index: 100;
    display: flex; align-items: center; justify-content: center;
    padding: 1rem;
    opacity: 0; pointer-events: none;
    transition: opacity 0.25s ease;
  }
  .panel-overlay.visible {
    opacity: 1; pointer-events: all;
  }
  .panel-bg {
    position: absolute; inset: 0;
    background: rgba(6,8,16,0.6);
    backdrop-filter: blur(12px);
    -webkit-backdrop-filter: blur(12px);
  }
  .panel {
    position: relative; z-index: 1;
    width: 100%; max-width: 460px;
    border-radius: 20px;
    background: rgba(255,255,255,0.05);
    border: 0.5px solid rgba(255,255,255,0.12);
    backdrop-filter: blur(40px) saturate(180%);
    -webkit-backdrop-filter: blur(40px) saturate(180%);
    box-shadow: 0 32px 80px rgba(0,0,0,0.7),
                inset 0 1px 0 rgba(255,255,255,0.1),
                inset 0 -1px 0 rgba(0,0,0,0.3);
    padding: 2rem;
    transform: scale(0.92) translateY(16px);
    transition: transform 0.3s cubic-bezier(0.34, 1.56, 0.64, 1);
    overflow: hidden;
  }
  .panel-overlay.visible .panel {
    transform: scale(1) translateY(0);
  }
  /* Glass shine */
  .panel::before {
    content: '';
    position: absolute; top: 0; left: 0; right: 0; height: 1px;
    background: linear-gradient(90deg, transparent, rgba(255,255,255,0.2), transparent);
  }
  .panel::after {
    content: '';
    position: absolute; top: 0; left: 0; width: 1px; bottom: 0;
    background: linear-gradient(180deg, rgba(255,255,255,0.15), transparent);
  }

  .panel-close {
    position: absolute; top: 1rem; right: 1rem;
    width: 28px; height: 28px; border-radius: 50%;
    border: 0.5px solid var(--glass-border);
    background: var(--glass);
    color: var(--text-muted);
    cursor: pointer;
    display: flex; align-items: center; justify-content: center;
    font-size: 14px;
    transition: all 0.15s;
  }
  .panel-close:hover { background: rgba(255,255,255,0.1); color: var(--text-primary); }

  .panel-header {
    display: flex; align-items: flex-start; gap: 1.25rem;
    margin-bottom: 1.5rem;
  }
  .panel-symbol-block {
    width: 80px; height: 80px; border-radius: 14px;
    border: 0.5px solid var(--panel-color, rgba(255,255,255,0.2));
    background: rgba(255,255,255,0.04);
    display: flex; flex-direction: column;
    align-items: center; justify-content: center;
    flex-shrink: 0;
    box-shadow: 0 0 30px -8px var(--panel-color, transparent),
                inset 0 1px 0 rgba(255,255,255,0.1);
  }
  .panel-sym-num {
    font-family: 'DM Mono', monospace;
    font-size: 0.6rem;
    color: var(--text-muted);
  }
  .panel-sym {
    font-size: 2.4rem; font-weight: 600;
    color: var(--panel-color, var(--text-primary));
    line-height: 1;
  }
  .panel-sym-mass {
    font-family: 'DM Mono', monospace;
    font-size: 0.52rem;
    color: var(--text-muted);
  }

  .panel-title-block { flex: 1; padding-top: 4px; }
  .panel-name {
    font-size: 1.5rem; font-weight: 500;
    letter-spacing: 0.04em;
    color: var(--text-primary);
    line-height: 1.1;
  }
  .panel-category {
    font-family: 'DM Mono', monospace;
    font-size: 0.64rem;
    color: var(--panel-color, var(--text-muted));
    letter-spacing: 0.12em;
    text-transform: uppercase;
    margin-top: 4px;
  }
  .panel-desc {
    font-size: 0.82rem;
    color: var(--text-muted);
    line-height: 1.65;
    margin-top: 8px;
  }

  .panel-props {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 8px;
    margin-top: 1.25rem;
  }
  .prop-card {
    border-radius: 10px;
    border: 0.5px solid var(--glass-border);
    background: rgba(255,255,255,0.03);
    padding: 10px 12px;
  }
  .prop-label {
    font-family: 'DM Mono', monospace;
    font-size: 0.56rem;
    color: var(--text-dim);
    letter-spacing: 0.12em;
    text-transform: uppercase;
    margin-bottom: 4px;
  }
  .prop-val {
    font-size: 0.88rem;
    font-weight: 500;
    color: var(--text-primary);
  }

  .state-badge {
    display: inline-flex; align-items: center; gap: 5px;
    padding: 3px 10px; border-radius: 20px;
    font-family: 'DM Mono', monospace;
    font-size: 0.62rem;
    font-weight: 500; letter-spacing: 0.08em;
    margin-top: 1rem;
  }
  .state-solid   { background: rgba(74,158,255,0.12); color: #4a9eff; border: 0.5px solid rgba(74,158,255,0.25); }
  .state-liquid  { background: rgba(80,217,224,0.12); color: #50d9e0; border: 0.5px solid rgba(80,217,224,0.25); }
  .state-gas     { background: rgba(176,138,255,0.12); color: #b08aff; border: 0.5px solid rgba(176,138,255,0.25); }
  .state-unknown { background: rgba(255,255,255,0.05); color: var(--text-muted); border: 0.5px solid var(--glass-border); }
  .state-dot { width: 6px; height: 6px; border-radius: 50%; background: currentColor; }

  /* Dimming when a category is highlighted */
  .el.dimmed { opacity: 0.18; filter: saturate(0); }
  .el.dimmed:hover { opacity: 1; filter: saturate(1); }

  /* Electron config display */
  .electron-display {
    margin-top: 1rem;
    font-family: 'DM Mono', monospace;
    font-size: 0.68rem;
    color: var(--text-muted);
    letter-spacing: 0.06em;
  }
  .electron-display span { color: var(--panel-color, var(--text-primary)); }

  footer {
    text-align: center;
    margin-top: 3rem;
    font-family: 'DM Mono', monospace;
    font-size: 0.6rem;
    color: var(--text-dim);
    letter-spacing: 0.12em;
  }

  @media (max-width: 600px) {
    .panel { padding: 1.5rem; }
    .panel-props { grid-template-columns: 1fr 1fr; gap: 6px; }
  }
</style>
</head>
<body>

<div class="bg-canvas" id="bgCanvas"></div>
<div class="blob blob1"></div>
<div class="blob blob2"></div>
<div class="blob blob3"></div>
<div class="blob blob4"></div>
<div class="blob blob5"></div>

<div class="page">
  <header>
    <h1>Periodic Table</h1>
    <p>118 elements &nbsp;·&nbsp; click any element to explore</p>
  </header>

  <div class="legend" id="legend"></div>

  <div class="table-wrapper">
    <div class="pt-grid" id="ptGrid"></div>
  </div>

  <footer>© periodic table of elements &nbsp;·&nbsp; 118 known elements</footer>
</div>

<!-- Detail Panel -->
<div class="panel-overlay" id="panelOverlay">
  <div class="panel-bg" id="panelBg"></div>
  <div class="panel" id="panel">
    <button class="panel-close" id="panelClose">✕</button>
    <div class="panel-header">
      <div class="panel-symbol-block" id="panelSymBlock">
        <span class="panel-sym-num" id="panelNum"></span>
        <span class="panel-sym" id="panelSym"></span>
        <span class="panel-sym-mass" id="panelMass"></span>
      </div>

        <div class="panel-name" id="panelName"></div>
        <div class="panel-category" id="panelCat"></div>
        <div class="panel-desc" id="panelDesc"></div>
      </div>
    </div>
    <div id="stateBadge"></div>
    <div class="panel-props" id="panelProps"></div>
    <div class="electron-display" id="elConf"></div>
  </div>
</div>

  if(activeCat===cat){ activeCat=null; document.querySelectorAll('.el').forEach(e=>e.classList.remove('dimmed')); return; }

}

  // Row 8 is spacer
  if(row===8){
    for(let col=1;col<=18;col++){
      const d=document.createElement('div');
      if(col===1||col===2){
        d.className='series-label gap';
        if(col===1) d.textContent='57–71';
        if(col===2) d.textContent='89–103';
      } else { d.className='gap el'; }
      grid.appendChild(d);
    }
    continue;
  }
  for(let col=1;col<=18;col++){
    const key=`${row}-${col}`;
    const sym=cells[key];
    if(!sym){
      const d=document.createElement('div');
      d.className='el gap';
      grid.appendChild(d);
      continue;
    }
    const data=elMap[sym];
    const color=CAT[data.cat]?.color||'#fff';
    const el=document.createElement('div');
    el.className='el';
    el.dataset.sym=sym;
    el.dataset.cat=data.cat;
    el.style.setProperty('--el-color',color);
    el.innerHTML=`<span class="el-num">${data.num}</span><span class="el-sym">${sym}</span><span class="el-name">${data.name.length>10?data.name.slice(0,9)+'…':data.name}</span>`;
    el.addEventListener('click',()=>openPanel(sym,el));
    grid.appendChild(el);
  }
}

  const color=CAT[data.cat]?.color||'rgba(255,255,255,0.6)';
  document.getElementById('panel').style.setProperty('--panel-color',color);
  document.getElementById('panelNum').textContent=data.num;
  document.getElementById('panelSym').textContent=sym;
  document.getElementById('panelMass').textContent=data.mass+' u';
  document.getElementById('panelName').textContent=data.name;
  document.getElementById('panelCat').textContent=CAT[data.cat]?.label||data.cat;
  document.getElementById('panelDesc').textContent=DESCRIPTIONS[sym]||'A chemical element.';

  const st=getState(sym);
  const stEl=document.getElementById('stateBadge');
  const stLabels={solid:'Solid at 25°C',liquid:'Liquid at 25°C',gas:'Gas at 25°C',unknown:'State unknown'};
  stEl.innerHTML=`<span class="state-badge state-${st}"><span class="state-dot"></span>${stLabels[st]}</span>`;

  const props=[
    ['Atomic number', data.num],
    ['Atomic mass', data.mass+' u'],
    ['Period', data.period],
    ['Group', data.group||'—'],
    ['Electronegativity', data.en!==null?data.en+' (Pauling)':'—'],
    ['Category', CAT[data.cat]?.label||data.cat],
  ];
  const propsEl=document.getElementById('panelProps');
  propsEl.innerHTML=props.map(([l,v])=>`<div class="prop-card"><div class="prop-label">${l}</div><div class="prop-val">${v}</div></div>`).join('');

  document.getElementById('elConf').innerHTML=`Electron config: <span>${data.ec}</span>`;

  if(currentEl) currentEl.classList.remove('active');
  currentEl=elEl;
  elEl.classList.add('active');
  overlay.classList.add('visible');
}

function closePanel(){
  overlay.classList.remove('visible');
  if(currentEl){ currentEl.classList.remove('active'); currentEl=null; }
}

panelClose.addEventListener('click',closePanel);
panelBg.addEventListener('click',closePanel);
document.addEventListener('keydown',e=>{ if(e.key==='Escape') closePanel(); });
</script>
</body>
</html>
